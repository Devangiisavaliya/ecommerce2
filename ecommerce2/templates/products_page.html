<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .header {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .product-card {
            transition: 0.3s;
            border-radius: 12px;
            overflow: hidden;
        }

        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .product-img {
            height: 200px;
            object-fit: cover;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 18px;
        }

        .desc {
            font-size: 13px;
            color: gray;
            height: 40px;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>{{ subcategory[1] }} Products</h2>
</div>

<div class="container mt-4">

    <div class="row">

        {% for p in products %}
        <div class="col-md-3 mb-4">

            <div class="card product-card">

                <!-- IMAGE -->
                <img src="{{ url_for('static', filename='uploads/' + p[4]) }}"
                     class="card-img-top product-img">

                <div class="card-body text-center">

                    <!-- NAME -->
                    <h6>{{ p[1] }}</h6>

                    <!-- PRICE -->
                    <p class="price">₹{{ p[2] }}</p>

                    <!-- DESCRIPTION -->
                    <p class="desc">{{ p[3] }}</p>

                    <!-- BUTTONS -->
                    <a href="/add_to_cart/{{ p[0] }}" class="btn btn-success btn-sm w-100 mb-1">
                        Add to Cart
                    </a>

                    <a href="/add_to_wishlist/{{ p[0] }}" class="btn btn-outline-danger btn-sm w-100">
                        ♥ Wishlist
                    </a>

                </div>

            </div>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
