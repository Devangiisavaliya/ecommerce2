<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            font-family:Arial;
            background:#f5f7fa;
        }

        h2{
            text-align:center;
            background:#0d6efd;
            color:#fff;
            padding:15px;
            margin:0;
        }

        table{
            width:90%;
            margin:30px auto;
            background:#fff;
            border-collapse:collapse;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        th,td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #eee;
        }

        th{
            background:#0d6efd;
            color:#fff;
        }

        /* =========================
           MOBILE RESPONSIVE ADD ONLY
        ========================= */

        @media(max-width:768px){

            table{
                width:95%;
                font-size:14px;
            }

            th, td{
                padding:8px;
            }

            h2{
                font-size:18px;
                padding:12px;
            }
        }

        @media(max-width:480px){

            table{
                font-size:12px;
            }

            th, td{
                padding:6px;
            }
        }

    </style>
</head>

<body>

<h2>My Orders</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Total</th>
        <th>Status</th>
    </tr>

    {% for o in orders %}
    <tr>
        <td>{{ o[0] }}</td>
        <td>{{ o[1] }}</td>
        <td>{{ o[2] }}</td>
        <td>₹{{ o[3] }}</td>
        <td>{{ o[4] }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
