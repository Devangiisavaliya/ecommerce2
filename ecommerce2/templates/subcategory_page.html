<!DOCTYPE html>
<html>
<head>
    <title>Subcategories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .header {
            background: #343a40;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .card-box {
            transition: 0.3s;
            border-radius: 10px;
        }

        .card-box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .container {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>{{ category[1] }} Subcategories</h2>
</div>

<div class="container">

    <div class="row">

        {% for s in subcategories %}
        <div class="col-md-3 mb-4">

            <div class="card card-box text-center p-3">

                <h5>{{ s[1] }}</h5>

                <p class="text-muted">Click to explore</p>

                <a href="/subcategory/{{ s[0] }}" class="btn btn-primary btn-sm">
                        View Products
                </a>

            </div>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
