<!DOCTYPE html>
<html>
<head>
    <title>Wishlist</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            font-family:Arial;
            background:#f5f7fa;
        }

        h2{
            text-align:center;
            background:#0d6efd;
            color:#fff;
            padding:15px;
        }

        .container{
            width:90%;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .card{
            background:#fff;
            padding:15px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        img{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:8px;
        }

        h3{
            margin:15px 0 10px;
        }

        .price{
            color:#0d6efd;
            font-size:20px;
            font-weight:bold;
        }

        .remove-btn{
            display:inline-block;
            margin-top:15px;
            padding:10px 15px;
            background:red;
            color:#fff;
            text-decoration:none;
            border-radius:5px;
        }

        /* =========================
           MOBILE RESPONSIVE ONLY
        ========================= */

        @media(max-width:768px){

            h2{
                font-size:18px;
                padding:12px;
            }

            .container{
                width:95%;
                grid-template-columns:1fr;
                gap:15px;
                margin-top:20px;
            }

            .card{
                padding:12px;
            }

            img{
                height:180px;
            }

            h3{
                font-size:16px;
            }

            .price{
                font-size:18px;
            }

            .remove-btn{
                padding:8px 12px;
                font-size:14px;
            }
        }

        @media(max-width:480px){

            img{
                height:160px;
            }

            h3{
                font-size:15px;
            }

            .price{
                font-size:16px;
            }

            .remove-btn{
                font-size:13px;
            }
        }

    </style>

</head>
<body>

<h2>My Wishlist ❤️</h2>

<div class="container">

{% for w in wishlist_items %}

    <div class="card">

        <img src="{{ url_for('static', filename='uploads/' + w[3]) }}">

        <h3>{{ w[1] }}</h3>

        <p class="price">₹{{ w[2] }}</p>

        <a href="/wishlist/remove/{{ w[0] }}" class="remove-btn">
            Remove
        </a>

    </div>

{% endfor %}

</div>

</body>
</html>
