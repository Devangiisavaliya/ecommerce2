<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f7fa;
            margin:0;
            padding:0;
        }

        h1{
            background:#0d6efd;
            color:#fff;
            padding:20px;
            margin:0;
            text-align:center;
        }

        form{
            width:350px;
            margin:50px auto;
            background:#fff;
            padding:25px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            outline:none;
        }

        input:focus{
            border-color:#0d6efd;
        }

        button{
            width:100%;
            padding:12px;
            background:#0d6efd;
            color:#fff;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#084298;
        }

    </style>
</head>

<body>

<h1>Add Product</h1>

<form method="POST" enctype="multipart/form-data">

    <input type="text" name="name" placeholder="Product Name" required><br><br>

    <input type="text" name="price" placeholder="Price" required><br><br>

    <input type="file" name="image" required><br><br>

    <button type="submit">Save Product</button>

</form>


</body>
</html>
