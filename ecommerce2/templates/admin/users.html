<!DOCTYPE html>
<html>
<head>
    <title>Registered Users</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .box {
            width: 90%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #007bff;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f1f1;
        }
    </style>

</head>

<body>

<h1>Registered Users</h1>

<div class="box">

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>

        {% for u in users %}
        <tr>
            <td>{{ u[0] }}</td>
            <td>{{ u[1] }}</td>
            <td>{{ u[2] }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
