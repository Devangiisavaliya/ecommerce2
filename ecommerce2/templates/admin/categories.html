<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body{
    font-family: Arial;
    background:#f5f7fa;
}

h2{
    text-align:center;
    padding:15px;
    background:#0d6efd;
    color:#fff;
    margin:0;
}

/* FORM */

form{
    text-align:center;
    margin:20px 0;
}

form input{
    padding:10px;
    width:250px;
    border:1px solid #ccc;
    border-radius:5px;
}

form button{
    padding:10px 15px;
    border:none;
    background:#0d6efd;
    color:#fff;
    border-radius:5px;
    cursor:pointer;
}

/* TABLE */

table{
    width:80%;
    margin:20px auto;
    border-collapse:collapse;
    background:#fff;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0d6efd;
    color:#fff;
}

/* DELETE */

a{
    color:red;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>


<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Categories</h2>

    <!-- ADD FORM -->
    <form method="POST" action="/admin/categories/add" class="mb-4">
        <input type="text" name="name" class="form-control mb-2" placeholder="Category Name" required>
        <button class="btn btn-primary">Add Category</button>
    </form>

    <!-- TABLE -->
    <table class="table table-bordered bg-white">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Action</th>
        </tr>

        {% for c in categories %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>
            <td>
                <a href="/admin/categories/delete/{{ c[0] }}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
